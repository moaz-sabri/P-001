# =============================================================================
# Docker Compose: app + MySQL + phpMyAdmin
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: P-001
    ports:
      - "8031:80"
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
      - uploads-data:/var/www/html/app/uploads
    environment:
      TZ: Asia/Beirut
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: appsecret
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: P-001-mysql
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: appsecret
      MYSQL_ROOT_PASSWORD: rootsecret
      TZ: Asia/Beirut
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: P-001-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage-data:
  uploads-data:
  mysql-data: