<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f7">
  <title>لا يوجد اتصال</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf9f7; color: #202124; }
    main { width: min(90vw, 28rem); padding: 2rem; text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
    p { line-height: 1.8; color: #5f6368; }
    button { border: 0; border-radius: .75rem; padding: .8rem 1.2rem; background: #c2410c; color: #fff; font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #131417; color: #f5f5f5; }
      p { color: #b9bbc1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الاتصال ثم حاول مرة أخرى. ستظهر المنتجات المحفوظة تلقائيًا عند توفرها.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
